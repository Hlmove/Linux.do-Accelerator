name: Build Release Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows-x64
            package_cmd: cargo packager -f nsis
          - os: windows-11-arm
            artifact_name: windows-arm64
            package_cmd: cargo packager -f nsis

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.artifact_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Sync build version from tag
        id: sync_version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 ./scripts/ci-sync-version.py
          else
            python ./scripts/ci-sync-version.py
          fi
          echo "RELEASE_VERSION=${{ github.ref_name }}" | sed 's/^RELEASE_VERSION=v/RELEASE_VERSION=/' >> "${GITHUB_ENV}"
          echo "LINUXDO_BUILD_VERSION=${{ github.ref_name }}" | sed 's/^LINUXDO_BUILD_VERSION=v/LINUXDO_BUILD_VERSION=/' >> "${GITHUB_ENV}"
          echo "LINUXDO_GIT_HASH=${GITHUB_SHA::12}" >> "${GITHUB_ENV}"

      - uses: dtolnay/rust-toolchain@stable

      - name: Use crates.io in CI
        shell: bash
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [registries.crates-io]
          protocol = "sparse"

          [net]
          git-fetch-with-cli = true
          EOF

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build binary
        run: cargo build --release --locked --bin linuxdo-accelerator

      - name: Package app
        run: ${{ matrix.package_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linuxdo-accelerator-${{ steps.sync_version.outputs.package_version }}-${{ matrix.artifact_name }}
          path: |
            dist/**
            target/release/linuxdo-accelerator*

  publish-release:
    needs:
      - build
    runs-on: ubuntu-latest
    name: Publish GitHub Release

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: linuxdo-accelerator-*
          path: release-artifacts
          merge-multiple: false

      - name: List release files
        run: find release-artifacts -type f | sort

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-artifacts/**/dist/**
          generate_release_notes: true
